services:
  bitcoin:
    image: bitcoin/bitcoin:28.1
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.00001000
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=rootcause-lab
      - -rpcpassword=regtest-only-password
      - -printtoconsole=1
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - bitcoin-regtest:/home/bitcoin/.bitcoin

volumes:
  bitcoin-regtest:
