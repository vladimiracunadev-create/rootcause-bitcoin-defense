# ─────────────────────────────────────────────────────────────────────────────
# CI — RootCause Bitcoin Defense
#
# Seis trabajos, y ninguno es decorativo:
#
#   1. calidad        → validacion del repositorio y tests en tres sistemas
#                       operativos y dos versiones de Node.
#   2. solo-local     → el claim de distribucion: cero dependencias, cero
#                       origenes remotos, CSP self-only.
#   3. invariantes    → el claim del producto: arranca la aplicacion REAL y
#                       comprueba que rechaza semillas, mutaciones sin cabecera
#                       y RPC remoto; y que la allowlist RPC sigue siendo de
#                       solo lectura.
#   4. regtest        → levanta Bitcoin Core desde cero, genera transacciones
#                       controladas y produce los cinco informes forenses.
#   5. app-windows    → empaqueta la edicion de escritorio y la ARRANCA para
#                       comprobar que sirve el panel. Un ZIP del tamano
#                       esperado no prueba que la aplicacion funcione.
#   6. documentacion  → los enlaces internos existen y el estilo visual sigue
#                       siendo el de la familia RootCause.
#
# Robustez: actions oficiales pinneadas a commit SHA, permisos minimos,
# concurrency con cancelacion y timeouts explicitos. No se ejecuta
# `pnpm install`: este repositorio no tiene dependencias a proposito, asi
# que CI nunca toca la red de un registro de paquetes.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Validacion y tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.12 es el minimo que declara package.json; 24 es la rama actual.
        # Windows esta primero en la lista porque es el destino principal.
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin credenciales persistidas en .git/config: nada de lo que
          # corre después necesita empujar al repositorio.
          persist-credentials: false

      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Validacion del repositorio
        run: node scripts/validate-repo.js

      - name: Tests
        run: node --test

  solo-local:
    name: Solo local — cero dependencias, cero origenes remotos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin credenciales persistidas en .git/config: nada de lo que
          # corre después necesita empujar al repositorio.
          persist-credentials: false

      - name: Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Si alguien introduce una dependencia, un CDN en el dashboard o
      # abre la CSP, este paso tumba el build.
      - name: Verificar el claim "solo local"
        run: node scripts/check-local-only.js

      # Segunda red de seguridad, independiente del script anterior.
      - name: Verificar que no hay arbol de dependencias
        run: |
          test ! -f package-lock.json || (echo "package-lock.json no deberia existir" && exit 1)
          node -e "const fs = require('node:fs'); const p = require('./package.json'); const fields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']; const declared = fields.flatMap((field) => Object.keys(p[field] || {})); const allowed = new Set(['.package-map.json', '.pnpm-workspace-state-v1.json']); const installed = fs.existsSync('node_modules') ? fs.readdirSync('node_modules', { withFileTypes: true }).filter((entry) => entry.isDirectory() || !allowed.has(entry.name)).map((entry) => entry.name) : []; if (declared.length || installed.length) { console.error('Dependencias detectadas:', [...declared, ...installed].join(', ')); process.exit(1); } process.stderr.write('  arbol de dependencias vacio\n');"

  invariantes:
    name: Invariantes de seguridad (aplicacion en marcha)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin credenciales persistidas en .git/config: nada de lo que
          # corre después necesita empujar al repositorio.
          persist-credentials: false

      - name: Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Arranca el servidor real y lo golpea con peticiones hostiles: semillas,
      # mnemonicos, passphrases, xprv, mutaciones sin cabecera local y
      # peticiones cross-site. Todas deben ser rechazadas.
      - name: Semillas, RPC y cabeceras
        run: node scripts/check-security-claims.js

      # La allowlist RPC no puede crecer hacia metodos que gastan. Este grep es
      # deliberadamente tonto y por eso no se le escapa nada.
      - name: Ningun metodo RPC de gasto en el codigo
        run: |
          if grep -rnE '"(sendrawtransaction|sendtoaddress|signrawtransactionwithwallet|walletpassphrase|importprivkey|dumpprivkey|walletcreatefundedpsbt)"' src/; then
            echo "Se encontro un metodo RPC capaz de mover fondos en src/"
            exit 1
          fi
          echo "  ningun metodo de gasto presente"

  regtest-forensics:
    name: Bitcoin Core regtest y reconciliacion UTXO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Generar y reconciliar DigitalCustody Labs
        run: node scripts/run-regtest-lab.js

      - name: Publicar los cinco informes forenses
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digital-custody-labs-forensics
          path: build/bitcoin-forensics-regtest/
          retention-days: 7
          if-no-files-found: error

  app-windows:
    name: Aplicacion de Windows (empaquetar y arrancar)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin credenciales persistidas en .git/config: nada de lo que
          # corre después necesita empujar al repositorio.
          persist-credentials: false

      - name: Generar el icono desde codigo
        shell: powershell
        run: .\packaging\windows\make-icon.ps1

      # El empaquetador descarga el node.exe oficial, verifica su SHA-256 y
      # arranca la aplicacion con ESE runtime antes de comprimir nada.
      - name: Empaquetar edicion portable
        shell: powershell
        run: .\packaging\windows\build-portable.ps1

      # Prueba de humo del lanzador de escritorio real: el .cmd que ejecuta el
      # usuario, no una invocacion artificial de node.
      - name: Arrancar el lanzador y pedir el panel
        shell: powershell
        env:
          PORT: "8799"
          ROOTCAUSE_OPEN_BROWSER: "0"
        run: |
          $app = "build\portable\RootCause-Bitcoin-Defense"
          $launcher = Join-Path $app "RootCause Bitcoin Defense.cmd"
          $process = Start-Process -FilePath $launcher -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/health" -TimeoutSec 3
                if ($health.service -eq "rootcause-bitcoin-defense") { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "El lanzador no sirvio /api/health en 30 segundos." }
            Write-Host "  health OK"

            $panel = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing -TimeoutSec 5
            if ($panel.Content -notmatch "RootCause Bitcoin Defense") {
              throw "El panel no contiene el titulo de la aplicacion."
            }
            Write-Host "  panel OK ($($panel.RawContentLength) bytes)"

            # El estado de demostracion tiene que llegar al usuario: una app que
            # arranca vacia es exactamente el fallo que nadie detecta a tiempo.
            $summary = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/summary" -TimeoutSec 5
            if ($summary.totals.wallets -lt 1) {
              throw "El paquete arranco sin inventario: el contenido no viajo dentro."
            }
            Write-Host "  inventario OK ($($summary.totals.wallets) wallets, riesgo $($summary.risk.score))"
          }
          finally {
            Get-Process node -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -like "*RootCause-Bitcoin-Defense*" } |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publicar el portable como artefacto de CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootcause-bitcoin-defense-portable-ci
          path: build/*.zip
          retention-days: 7
          if-no-files-found: error

  documentacion:
    name: Documentacion coherente
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin credenciales persistidas en .git/config: nada de lo que
          # corre después necesita empujar al repositorio.
          persist-credentials: false

      - name: Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Un README que apunta a un documento inexistente es una promesa rota.
      - name: Los documentos referenciados existen
        run: node scripts/check-docs.js

      # El lenguaje visual de la familia RootCause no puede depender de que
      # alguien se acuerde: un H1, tablas con cabecera, bloques con lenguaje y
      # todo documento de docs/ enlazado desde el índice.
      - name: Estilo visual de la documentación
        run: node scripts/check-doc-style.js

      # Las 26 fichas de regla y su versión publicada se GENERAN desde
      # config/rules-catalog.json. Si alguien edita una a mano, o añade una regla
      # sin regenerar, aquí se ve.
      - name: Fichas de regla sincronizadas con el catálogo
        run: node scripts/generate-rule-docs.js --check

      # Las 26 fichas de regla y su página publicada se GENERAN del catálogo.
      # Si alguien edita una ficha a mano, o añade una regla sin documentarla,
      # aquí se ve.
      - name: Las fichas de regla coinciden con el catálogo
        run: node scripts/generate-rule-docs.js --check
